<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paulo Diniz | Relacional TI</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Inter', sans-serif;
    background: #0a1628;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 56px 24px 40px;
    color: #fff;
  }
  .bg-glow {
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at 50% -10%, rgba(255,255,255,0.06) 0%, transparent 55%);
    pointer-events: none;
    z-index: 0;
  }
  .content { position: relative; z-index: 1; width: 100%; max-width: 420px; display: flex; flex-direction: column; align-items: center; }
  .photo-ring {
    width: 108px; height: 108px; border-radius: 50%;
    background: linear-gradient(135deg, rgba(255,255,255,0.18), rgba(255,255,255,0.04));
    padding: 3px; margin-bottom: 20px;
  }
  .photo { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; display: block; }
  .name { font-size: 24px; font-weight: 700; letter-spacing: -0.3px; }
  .role { font-size: 12px; font-weight: 500; letter-spacing: 1.5px; text-transform: uppercase; color: rgba(255,255,255,0.45); margin-top: 6px; }
  .logo { height: 34px; margin-top: 22px; opacity: 0.9; }
  .links { width: 100%; margin-top: 36px; display: flex; flex-direction: column; gap: 12px; }
  .link-btn {
    display: flex; align-items: center; gap: 14px;
    background: rgba(255,255,255,0.045);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 14px;
    padding: 16px 18px;
    text-decoration: none;
    color: #fff;
    transition: background 0.15s ease, transform 0.15s ease;
  }
  .link-btn:active { transform: scale(0.98); }
  .link-icon {
    width: 22px; height: 22px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    opacity: 0.75;
  }
  .link-icon svg { width: 20px; height: 20px; }
  .link-text { font-size: 14.5px; font-weight: 500; }
  .link-sub { font-size: 11.5px; color: rgba(255,255,255,0.4); margin-top: 1px; }
  .footer { margin-top: 44px; font-size: 11px; color: rgba(255,255,255,0.25); letter-spacing: 0.5px; text-align: center; }
  .footer a { color: rgba(255,255,255,0.35); text-decoration: none; }
</style>
</head>
